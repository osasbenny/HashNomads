services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hashnomads
      POSTGRES_USER: hashnomads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashnomads"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
